plugins {
    id 'java'
    id 'io.qameta.allure' version '2.12.0'
}

group = 'guru.qa'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

def selenideVersion = '7.6.0'
def allureVersion = '2.29.0'
def junitVersion = '5.10.2'
def ownerVersion = '1.0.12'
def aspectjVersion = '1.9.22'
def slf4jVersion = '2.0.13'

allure {
    report {
        version.set(allureVersion)
    }
    adapter {
        aspectjWeaver.set(true)
        frameworks {
            junit5 {
                adapterVersion.set(allureVersion)
            }
        }
    }
}

dependencies {
    testImplementation "com.codeborne:selenide:${selenideVersion}"
    testImplementation "io.qameta.allure:allure-selenide:${allureVersion}"
    testImplementation "io.qameta.allure:allure-junit5:${allureVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation "org.aeonbits.owner:owner:${ownerVersion}"
    testImplementation "org.aspectj:aspectjweaver:${aspectjVersion}"
    testImplementation "org.slf4j:slf4j-simple:${slf4jVersion}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()

    systemProperties(System.getProperties())

    systemProperty "allure.results.directory", "build/allure-results"

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "short"
        showExceptions true
        showCauses true
    }

    doFirst {
        def aspectjWeaver = configurations.testRuntimeClasspath.find {
            it.name.contains('aspectjweaver')
        }
        if (aspectjWeaver != null) {
            jvmArgs "-javaagent:${aspectjWeaver.absolutePath}"
        }
    }
}